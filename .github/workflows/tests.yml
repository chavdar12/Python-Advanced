name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build (byte-compile every script)
        run: python -m compileall -q .
      - name: Test every lesson on its own
        run: for lesson in [0-9][0-9][0-9]-*/; do ls "$lesson"test*.py >/dev/null 2>&1 || continue; (cd "$lesson" && python -m unittest -v) || exit 1; done
